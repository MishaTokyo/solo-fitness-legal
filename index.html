<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Solo Fitness</title>
  <meta name="description" content="Solo Fitness — a Solo-Leveling-flavored gym tracker." />
  <style>
    :root {
      --bg: #0a0a0f;
      --panel: #14141c;
      --text: #e8e8f0;
      --muted: #9a9ab0;
      --accent: #7c3aed;
      --border: #26262e;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.6; }
    main { max-width: 640px; margin: 0 auto; padding: 64px 20px 80px; text-align: center; }
    img.icon { width: 128px; height: 128px; border-radius: 28px; box-shadow: 0 12px 40px rgba(124, 58, 237, 0.35); }
    h1 { font-size: 32px; margin: 24px 0 8px; letter-spacing: -0.01em; }
    p.tagline { color: var(--muted); margin: 0 0 32px; }
    .links { display: flex; flex-direction: column; gap: 12px; max-width: 320px; margin: 0 auto; }
    .links a {
      display: block;
      padding: 14px 18px;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .links a:hover { border-color: var(--accent); background: #1c1c26; }
    footer { color: var(--muted); font-size: 12px; margin-top: 64px; }
  </style>
</head>
<body>
  <main>
    <img src="./icon-512.png" alt="Solo Fitness icon" class="icon" />
    <h1>Solo Fitness</h1>
    <p class="tagline">Awaken the hunter within.</p>
    <div class="links">
      <a href="./privacy-policy.html">Privacy Policy</a>
      <a href="./terms-of-service.html">Terms of Service</a>
      <a href="./account-delete.html">Delete your account</a>
    </div>
    <footer>© 2026 Solo Fitness</footer>
  </main>
</body>
</html>
